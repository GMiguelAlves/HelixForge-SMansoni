name: Validate project contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project metadata and reference contracts
        run: python scripts/validate/validate_project.py
      - name: Validate frozen source package
        run: python provenance/source_package/frozen/scripts/validate_package.py provenance/source_package/frozen
      - name: Run contract tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate shell syntax
        run: |
          find scripts config -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
